
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Profile</h1>
    </header>

    <main>
        <section>
            <h2>Personal Information</h2>
            <p>Name: <span id="profileName"></span></p>
            <p>Birth Year: <span id="profileYear"></span></p>
            <p>Developer: <span id="developerStatus"></span></p>
            <p>Current Age: <span id="profileAge"></span></p>
            <p>Number of Hobbies: <span id="hobbyCount"></span></p>
        </section>

        <section>
            <h2>Create / Update Profile</h2>
            <form id="profileForm">
                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="birthYear">Birth Year</label>
                <input type="number" id="birthYear" min="1900" required>

                <button type="submit">Update Profile</button>
            </form>
        </section>

        <section>
            <h2>My Hobbies</h2>
            <ul id="hobbyList"></ul>

            <label for="newHobby">New Hobby</label>
            <input type="text" id="newHobby" placeholder="Enter a hobby">

            <button id="addButton" type="button">Add Item</button>
            <button id="removeButton" type="button">Remove Item</button>
            <p id="message"></p>
        </section>
    </main>
    <footer>
        <p>Assignment 5</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
